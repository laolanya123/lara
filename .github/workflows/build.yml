name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: list available Xcode versions
        run: ls -d /Applications/Xcode* 2>/dev/null || true

      - name: select latest stable Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null \
            | grep -vi beta \
            | sort -V \
            | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "No stable Xcode found, falling back to default"
            XCODE_APP="/Applications/Xcode.app"
          fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: build ipa
        run: bash ipabuild.sh

      - name: verify lara.ipa exists
        run: |
          if [ ! -f lara.ipa ]; then
            echo "lara.ipa was not produced"
            exit 1
          fi
          ls -lh lara.ipa

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: lara.ipa
          retention-days: 14
